name: Daily photocard gallery update

on:
  schedule:
    # 03:00 UTC = 09:00 Bangladesh time
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      new_per_member:
        description: "Maximum NEW photos to try per member (1–100)"
        required: true
        default: "2"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --upgrade ddgs

      - name: Download new photos and rebuild gallery
        env:
          NEW_PER_MEMBER: ${{ github.event.inputs.new_per_member || '2' }}
        run: python download_photos.py "$NEW_PER_MEMBER"

      - name: Commit newly downloaded photos and photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TXT ENHYPEN photos.json
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
          else
            git commit -m "Daily photocard gallery update"
            git push origin main
          fi

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html photos.json _site/
          cp -r TXT ENHYPEN _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        uses: actions/deploy-pages@v4
